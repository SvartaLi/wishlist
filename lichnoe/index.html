<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f3f0"><title>Мой виш-лист</title>
<style>
:root{--ink:#352d33;--muted:#887d84;--rose:#bd7185;--line:#eadfe3;--paper:#fffdfc;--bg:#f8f4f2;--green:#54816b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:48px 22px 70px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}h1{font:500 clamp(34px,6vw,54px)/1.08 Georgia,serif;margin:0 0 10px;letter-spacing:-1px}.sub{color:var(--muted);margin:0}.top-actions,.toolbar,.card-actions{display:flex;gap:9px;flex-wrap:wrap}.top-actions{justify-content:flex-end}button,.button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 15px;background:white;color:var(--ink);text-decoration:none;transition:.15s}button:hover,.button:hover{transform:translateY(-1px);border-color:#d3a4b0}.primary{background:var(--rose);color:white;border-color:var(--rose)}.quiet{background:transparent}.intro{margin:28px 0 22px;padding:13px 16px;border-left:3px solid #d8a8b5;background:#fff9fa;border-radius:0 12px 12px 0;color:#72656c;font-size:14px}.toolbar{align-items:center;margin:20px 0}.search{flex:1;min-width:190px}input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);background:white;border-radius:11px;padding:11px 12px;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px #bd71851c}.toolbar select{width:auto;min-width:155px}.count{color:var(--muted);font-size:14px;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:18px;display:flex;flex-direction:column;min-height:190px;box-shadow:0 4px 16px #38242a08}.card.done{opacity:.68}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card h2{font:500 21px/1.25 Georgia,serif;margin:0 0 8px;overflow-wrap:anywhere}.badge{font-size:12px;color:#8d5364;background:#f8e9ed;padding:4px 9px;border-radius:99px;white-space:nowrap}.note{color:#766b71;font-size:14px;margin:4px 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}.price{font-size:14px;color:#64585f;margin-top:auto;padding-top:8px}.card a{color:#a35168;text-decoration:none}.card a:hover{text-decoration:underline}.card-actions{margin-top:15px}.card-actions button{padding:7px 10px;font-size:13px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 20px;border:1px dashed #ddcdd3;border-radius:18px}.empty strong{display:block;color:var(--ink);font:24px Georgia,serif;margin-bottom:7px}.footer{margin-top:34px;color:var(--muted);font-size:13px;text-align:center}dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));box-shadow:0 22px 80px #29151f44}dialog::backdrop{background:#24182066}.form{padding:24px}.form h2{font:28px Georgia,serif;margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted)}textarea{min-height:90px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:19px}.file-input{display:none}@media(max-width:620px){.wrap{padding:30px 16px 50px}header{display:block}.top-actions{justify-content:flex-start;margin-top:17px}.toolbar select{flex:1}.count{width:100%;margin-left:0}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body><main class="wrap"><header><div><h1>Мой виш-лист</h1><p class="sub">Идеи и желания — в одном уютном месте ✨</p></div><div class="top-actions"><button id="exportBtn">Скачать копию</button><button id="importBtn">Загрузить копию</button><input id="fileInput" class="file-input" type="file" accept="application/json"><button class="primary" id="addBtn">+ Добавить желание</button></div></header>
<div class="intro">Записи сохраняются в этом браузере и не попадают в общий репозиторий. На другом устройстве список сам не появится — для переноса используй кнопки копии сверху.</div>
<div class="toolbar"><input class="search" id="search" placeholder="Найти желание…" aria-label="Найти желание"><select id="filter"><option value="all">Все желания</option><option value="active">Ещё хочу</option><option value="done">Уже исполнила</option></select><select id="sort"><option value="new">Сначала новые</option><option value="price">Сначала недорогие</option><option value="priority">По приоритету</option></select><span class="count" id="count"></span></div>
<section class="grid" id="list" aria-live="polite"></section><p class="footer">Твои желания — в твоём темпе 💛</p></main>
<dialog id="dialog"><form class="form" id="form"><h2 id="formTitle">Новое желание</h2><input type="hidden" id="itemId"><div class="fields"><div class="field full"><label for="title">Что хочется *</label><input id="title" required maxlength="120" placeholder="Например, красивый чайный набор"></div><div class="field"><label for="category">Раздел</label><input id="category" maxlength="40" placeholder="Для дома, красота…"></div><div class="field"><label for="price">Примерная цена</label><input id="price" maxlength="50" placeholder="до 1 000 ₽"></div><div class="field full"><label for="url">Ссылка</label><input id="url" type="url" placeholder="https://…"></div><div class="field full"><label for="notes">Заметка</label><textarea id="notes" maxlength="500" placeholder="Цвет, размер, почему нравится…"></textarea></div><div class="field"><label for="priority">Насколько хочется</label><select id="priority"><option value="3">Очень хочу</option><option value="2" selected>Хочу</option><option value="1">Когда-нибудь</option></select></div></div><div class="form-actions"><button type="button" id="cancelBtn">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></dialog>
<script>
(function(){'use strict';var KEY='vika-personal-wishlist-v1',items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[];}catch(e){items=[];}var list=document.getElementById('list'),dialog=document.getElementById('dialog'),form=document.getElementById('form');function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function priceNum(s){var n=String(s||'').replace(/[^0-9]/g,'');return n?Number(n):Infinity}function render(){var q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('filter').value,sort=document.getElementById('sort').value;var shown=items.filter(function(x){return(f==='all'||(f==='done'?x.done:!x.done))&&(!q||(x.title+' '+x.category+' '+x.notes+' '+x.price).toLowerCase().indexOf(q)>=0)});shown.sort(function(a,b){if(sort==='price')return priceNum(a.price)-priceNum(b.price);if(sort==='priority')return Number(b.priority)-Number(a.priority);return b.created-a.created});document.getElementById('count').textContent=shown.length+' из '+items.length; if(!shown.length){list.innerHTML='<div class="empty"><strong>'+(items.length?'Ничего не нашлось':'Пока здесь пусто')+'</strong>'+(items.length?'Попробуй изменить поиск или фильтр.':'Добавь первое желание — всё можно будет поправить позже.')+'</div>';return}list.innerHTML=shown.map(function(x){var safeUrl='';try{var u=new URL(x.url);if(u.protocol==='https:'||u.protocol==='http:')safeUrl=u.href}catch(e){}return '<article class="card '+(x.done?'done':'')+'"><div class="card-top"><div><h2>'+esc(x.title)+'</h2>'+(x.category?'<span class="badge">'+esc(x.category)+'</span>':'')+'</div><span aria-label="Приоритет">'+(x.priority==='3'?'⭐':'')+'</span></div>'+(x.notes?'<p class="note">'+esc(x.notes)+'</p>':'')+(x.price?'<div class="price">'+esc(x.price)+'</div>':'')+(safeUrl?'<p class="note"><a href="'+esc(safeUrl)+'" target="_blank" rel="noopener noreferrer">Открыть ссылку ↗</a></p>':'')+'<div class="card-actions"><button data-act="done" data-id="'+esc(x.id)+'">'+(x.done?'Вернуть в желания':'Исполнилось ✓')+'</button><button data-act="edit" data-id="'+esc(x.id)+'">Изменить</button><button data-act="delete" data-id="'+esc(x.id)+'">Удалить</button></div></article>'}).join('')}
function resetForm(){form.reset();document.getElementById('itemId').value='';document.getElementById('priority').value='2';document.getElementById('formTitle').textContent='Новое желание'}function edit(x){resetForm();document.getElementById('formTitle').textContent=x?'Изменить желание':'Новое желание';if(x){document.getElementById('itemId').value=x.id;document.getElementById('title').value=x.title||'';document.getElementById('category').value=x.category||'';document.getElementById('price').value=x.price||'';document.getElementById('url').value=x.url||'';document.getElementById('notes').value=x.notes||'';document.getElementById('priority').value=x.priority||'2'}dialog.showModal();document.getElementById('title').focus()}
document.getElementById('addBtn').addEventListener('click',function(){edit(null)});document.getElementById('cancelBtn').addEventListener('click',function(){dialog.close()});form.addEventListener('submit',function(e){e.preventDefault();var id=document.getElementById('itemId').value,old=items.find(function(x){return x.id===id}),url=document.getElementById('url').value.trim();if(url){try{var parsed=new URL(url);if(parsed.protocol!=='https:'&&parsed.protocol!=='http:')throw 0;url=parsed.href}catch(e){alert('Проверь ссылку — нужен адрес, начинающийся с http:// или https://');return}}var obj={id:id||String(Date.now())+Math.random().toString(36).slice(2,7),title:document.getElementById('title').value.trim(),category:document.getElementById('category').value.trim(),price:document.getElementById('price').value.trim(),url:url,notes:document.getElementById('notes').value.trim(),priority:document.getElementById('priority').value,done:old?old.done:false,created:old?old.created:Date.now()};if(old)items=items.map(function(x){return x.id===id?obj:x});else items.push(obj);dialog.close();save()});list.addEventListener('click',function(e){var b=e.target.closest('button[data-act]');if(!b)return;var id=b.dataset.id,x=items.find(function(i){return i.id===id});if(!x)return;if(b.dataset.act==='edit')edit(x);if(b.dataset.act==='done'){x.done=!x.done;save()}if(b.dataset.act==='delete'&&confirm('Удалить желание «'+x.title+'»?')){items=items.filter(function(i){return i.id!==id});save()}});['search','filter','sort'].forEach(function(id){document.getElementById(id).addEventListener('input',render);document.getElementById(id).addEventListener('change',render)});document.getElementById('exportBtn').addEventListener('click',function(){var blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moy-vish-list.json';a.click();URL.revokeObjectURL(a.href)});document.getElementById('importBtn').addEventListener('click',function(){document.getElementById('fileInput').click()});document.getElementById('fileInput').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var data=JSON.parse(r.result);if(!Array.isArray(data)||!data.every(function(x){return x&&typeof x.title==='string'}))throw 0;if(confirm('Заменить текущий список данными из копии?')){items=data.map(function(x){return{id:String(x.id||Date.now()+Math.random()),title:String(x.title).slice(0,120),category:String(x.category||'').slice(0,40),price:String(x.price||'').slice(0,50),url:String(x.url||''),notes:String(x.notes||'').slice(0,500),priority:['1','2','3'].indexOf(String(x.priority))>=0?String(x.priority):'2',done:!!x.done,created:Number(x.created)||Date.now()}});save()}}catch(err){alert('Не получилось прочитать эту копию списка.')}e.target.value=''};r.readAsText(file)});render()})();
</script></body></html>
